<!DOCTYPE html>
<html>
<head>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
</head>
<body>
  <model-viewer id="mv" src="assets/models/room_with_listener.glb"></model-viewer>
  <script>
    const mv = document.getElementById('mv');
    mv.addEventListener('load', () => {
      const symbols = Object.getOwnPropertySymbols(mv);
      const sceneSymbol = symbols.find(s => s.description === 'scene');
      const scene = mv[sceneSymbol];
      scene.traverse((node) => {
        if (node.isMesh) {
          console.log("Mesh name:", node.name);
        }
      });
    });
  </script>
</body>
</html>
