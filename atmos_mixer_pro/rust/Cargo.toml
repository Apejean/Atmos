[package]
name = "rust_lib_atmos_mixer_pro"
version = "1.1.2"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.45"
cpal = { version = "0.15.2", features = ["asio"] }
crossbeam-channel = "0.5.15"
ebur128 = "0.1.10"
flutter_rust_bridge = "=2.12.0"
hound = "3.5.1"
lazy_static = "1.5.0"
once_cell = "1.21.4"
parking_lot = "0.12.3"
realfft = "3.5.0"
rosc = "0.11.4"
rtrb = "0.3.4"
rubato = "0.12.0"
rustfft = "6.4.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
socket2 = "0.6.5"
sofa-reader = "0.1.6"
symphonia = { version = "0.5.3", features = ["all"] }
tokio = { version = "1.40.0", features = ["rt-multi-thread", "net", "macros", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

[target.'cfg(not(target_os = "windows"))'.dependencies]
cpal = "0.15.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8.6"
coreaudio-sys = "0.2.15"

[target.'cfg(target_os = "windows")'.dependencies]
cpal = { version = "0.15.2", features = ["asio"] }
windows = { version = "0.58.0", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_Devices_Properties", "Win32_Foundation", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Shell", "Win32_System_Memory", "Win32_System_Threading"] }

[profile.dev]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
