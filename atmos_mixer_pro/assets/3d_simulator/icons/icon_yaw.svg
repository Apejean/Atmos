<svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#4FC3F7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
  <!-- Floor Grid (Isometric Square) -->
  <polygon points="32,60 6,47 32,34 58,47" fill="#4FC3F7" fill-opacity="0.1" stroke-width="1.5" />
  <polygon points="32,54 14,45 32,36 50,45" stroke="#4FC3F7" stroke-width="0.8" stroke-opacity="0.5" />

  <!-- Back arc of horizontal Yaw rotation circle (dashed) -->
  <path d="M 54 36 C 54 26, 10 26, 10 36" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.4" />

  <!-- Solid 3D Speaker (Center) -->
  <g stroke-width="1.2" fill="#0F1722" fill-opacity="0.95">
    <polygon points="32,24 42,29 32,34 22,29" />
    <polygon points="32,34 42,29 42,45 32,50" />
    <polygon points="22,29 32,34 32,50 22,45" />
    <g opacity="0.7" stroke-width="0.8">
      <ellipse cx="27" cy="33" rx="1.5" ry="2.5" transform="rotate(-26.5 27 33)" />
      <ellipse cx="27" cy="40" rx="2.5" ry="4" transform="rotate(-26.5 27 40)" />
      <circle cx="27" cy="40" r="0.8" fill="#4FC3F7" stroke="none" />
    </g>
  </g>

  <!-- Front arc of horizontal Yaw rotation circle (등각투영 타원에 맞춘 자연스러운 유선형 곡선) -->
  <path d="M 10 36 C 10 47, 52 47, 54 30" stroke-width="1.8" />
  
  <!-- Right Arrowhead (곡선의 진행 각도와 100% 일치하는 회전 화살표) -->
  <path d="M 48 35 L 54 30 L 57 37" stroke-width="1.8" />
</svg>