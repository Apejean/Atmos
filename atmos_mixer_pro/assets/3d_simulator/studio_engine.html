<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ATMOS 3D Studio Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0B0F14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <script src="js/three.min.js"></script>
  <script src="js/OrbitControls.js"></script>
  <script src="js/OBJLoader.js"></script>
</head>
<body>
  <canvas id="canvas3d"></canvas>

  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      console.error("Global Error: " + msg + " at line " + lineNo);
      return false;
    };
    // --- 1. Scene Initialization ---
    const canvas = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0B0F14);

    let initialAspect = window.innerWidth / window.innerHeight;
    if (isNaN(initialAspect) || initialAspect === 0 || !isFinite(initialAspect)) {
      initialAspect = 1.0;
    }
    const camera = new THREE.PerspectiveCamera(45, initialAspect, 0.1, 2000);
    camera.position.set(0, 4.5, 6.5);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.zoomSpeed = 1.0;
    controls.panSpeed = 0.8;
    controls.minDistance = 1.0;
    controls.maxDistance = 2000.0;
    controls.target.set(0, 1.2, 0); // Focus at ear level (1.2m)

    // --- 2. Studio Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0x38bdf8, 0x0f172a, 0.6);
    hemiLight.position.set(0, 10, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(5, 8, 5);
    scene.add(dirLight);

    const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 0.4);
    dirLight2.position.set(-5, 4, -5);
    scene.add(dirLight2);

    // --- 3. Scene Groups ---
    const roomGroup = new THREE.Group();
    const listenerGroup = new THREE.Group();
    const speakersGroup = new THREE.Group();
    scene.add(roomGroup);
    scene.add(listenerGroup);
    scene.add(speakersGroup);

    // Current State
    let currentRoom = { width: 6.0, depth: 4.5, height: 3.0 };
    let currentSpeakers = [];
    let selectedSpeakerId = null;

    // --- 4. Room Wireframe & Grid Builder ---
    function buildRoom(w, d, h) {
      while (roomGroup.children.length > 0) {
        const obj = roomGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        roomGroup.remove(obj);
      }

      const halfW = w / 2;
      const halfD = d / 2;

      // 4.1 Floor Grid
      const gridHelper = new THREE.GridHelper(Math.max(w, d) * 1.2, Math.round(Math.max(w, d) * 2), 0x0ea5e9, 0x1e293b);
      gridHelper.position.y = 0;
      roomGroup.add(gridHelper);

      // 4.2 3D Room Bounding Box Wireframe
      const boxGeo = new THREE.BoxGeometry(w, h, d);
      const wireGeo = new THREE.WireframeGeometry(boxGeo);
      const wireMat = new THREE.LineBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.25
      });
      const wireframe = new THREE.LineSegments(wireGeo, wireMat);
      wireframe.position.set(0, h / 2, 0);
      roomGroup.add(wireframe);

      // 4.3 Floor Boundary Line
      const floorLinePts = [
        new THREE.Vector3(-halfW, 0.005, -halfD),
        new THREE.Vector3(halfW, 0.005, -halfD),
        new THREE.Vector3(halfW, 0.005, halfD),
        new THREE.Vector3(-halfW, 0.005, halfD),
        new THREE.Vector3(-halfW, 0.005, -halfD)
      ];
      const floorGeo = new THREE.BufferGeometry().setFromPoints(floorLinePts);
      const floorMat = new THREE.LineBasicMaterial({ color: 0x0ea5e9, linewidth: 2 });
      roomGroup.add(new THREE.Line(floorGeo, floorMat));
    }

    // --- 5. Smart 3D Listener Mannequin System (FinalBaseMesh OBJ + Acoustic Ear Canal Alignment) ---
    let currentEarLevel = 1.2;
    let cachedOBJModel = null;
    let mannequinScale = 1.2; // Multiplier (1.0 = standard 1.75m human body, 1.2 = prominent studio size)

    function renderListenerOBJ(obj, earLevel) {
      // 1. 로직 프로 스타일 무광 스튜디오 그레이 머티리얼 적용
      const dummyMat = new THREE.MeshStandardMaterial({
        color: 0x8a9ba8,
        roughness: 0.55,
        metalness: 0.05
      });

      // 2. 바운딩 박스 및 스케일 계산
      const box = new THREE.Box3().setFromObject(obj);
      const size = new THREE.Vector3();
      box.getSize(size);
      const center = new THREE.Vector3();
      box.getCenter(center);

      // 머리/상체 비율은 표준 성인(1.75m) 기준으로 고정하여 거인이 되지 않도록 함
      const baseHumanHeight = 1.75 * mannequinScale;
      const scale = baseHumanHeight / (size.y || 1);

      // 3. 하체 늘리기/줄이기 계산 (얼굴/상체 변형 완벽 방지)
      const localEarYFromBottom = size.y * 0.927; // 귀 위치 (약 92.7%)
      const localWaistY = size.y * 0.48;          // 허리/골반 위치 (48%)
      const localAnkleY = size.y * 0.08;          // 발목 위치 (8%)

      const targetLocalEarYFromBottom = earLevel / scale;
      let diff = targetLocalEarYFromBottom - localEarYFromBottom;
      let sinkOffset = 0;

      // 극단적으로 귀 높이를 낮출 경우 다리가 역전(Invert)되지 않도록 최소 길이 보장
      const minLegLength = size.y * 0.10;
      if (localWaistY + diff < localAnkleY + minLegLength) {
          const allowedDiff = (localAnkleY + minLegLength) - localWaistY;
          sinkOffset = diff - allowedDiff; // 다리를 한계까지 줄인 후 남은 차이는 땅으로 꺼지게 함
          diff = allowedDiff;
      }

      // 4. 버텍스(정점) 조작으로 하체만 동적 보정
      obj.traverse((child) => {
        if (child.isMesh) {
          child.material = dummyMat;
          child.castShadow = true;
          child.receiveShadow = true;

          // 원본 캐시 훼손 방지를 위해 Geometry 복제
          child.geometry = child.geometry.clone();
          const pos = child.geometry.attributes.position;

          for (let i = 0; i < pos.count; i++) {
              const y = pos.getY(i);
              const yFromBottom = y - box.min.y;

              if (yFromBottom > localWaistY) {
                  // 허리 위 상체/얼굴: 형태를 100% 유지한 채 그대로 높이만 이동 (비율 왜곡 X)
                  pos.setY(i, y + diff);
              } else if (yFromBottom > localAnkleY) {
                  // 발목 ~ 허리 사이 (다리): 단순 선형 보간(Linear)으로 늘림/줄임
                  // ※ 이전의 곡선(Smooth) 보간은 다리 중간을 접히게 만들었으므로 선형으로 수정하여 찢어짐 완벽 해결
                  const t = (yFromBottom - localAnkleY) / (localWaistY - localAnkleY);
                  pos.setY(i, y + diff * t);
              }
              // 발목 아래(발): y 위치 변경 없음 (바닥에 완벽히 고정)
          }
          child.geometry.computeVertexNormals();
        }
      });

      obj.scale.set(scale, scale, scale);

      // 5. 최종 배치 (발을 정확히 Y=0 바닥에 고정)
      obj.position.set(-center.x * scale, (-box.min.y + sinkOffset) * scale, -center.z * scale);
      listenerGroup.add(obj);
      console.log(`[ATMOS 3D] Smart Mannequin Rendered: earLevel=${earLevel}m, scale=${mannequinScale}, diff=${diff.toFixed(2)}, sink=${sinkOffset.toFixed(2)}`);
    }

    function buildListenerMannequin(earLevel = 1.2) {
      currentEarLevel = earLevel;

      // 기존 메쉬 정리
      while (listenerGroup.children.length > 0) {
        const obj = listenerGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        listenerGroup.remove(obj);
      }

      // 바닥 청록색 스윗스팟 링 고정 (Y = 0.02m)
      const ringRadius = 0.45 * Math.max(1.0, mannequinScale);
      const ringGeo = new THREE.RingGeometry(ringRadius * 0.9, ringRadius, 48);
      ringGeo.rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.position.set(0, 0.02, 0);
      listenerGroup.add(ringMesh);

      if (cachedOBJModel) {
        renderListenerOBJ(cachedOBJModel.clone(true), currentEarLevel);
        return;
      }

      // FinalBaseMesh.obj 3D 모델 로드
      if (typeof THREE.OBJLoader !== 'undefined') {
        const objLoader = new THREE.OBJLoader();
        objLoader.load(
          '../models/listener_head.obj',
          function (obj) {
            cachedOBJModel = obj;
            renderListenerOBJ(obj.clone(true), currentEarLevel);
          },
          undefined,
          function (err) {
            console.warn('OBJ 로드 실패 또는 경로 오류:', err);
          }
        );
      }
    }

    window.updateEarLevel = function(level) {
      buildListenerMannequin(level);
    };

    window.setMannequinScale = function(scaleMultiplier) {
      mannequinScale = scaleMultiplier;
      buildListenerMannequin(currentEarLevel);
    };

// --- 6. 3D Studio Monitor Speaker Builder ---
    function createSpeaker3DMesh(speakerData) {
      const group = new THREE.Group();
      group.name = "speaker_" + speakerData.id;
      group.userData = { speakerId: speakerData.id, isFixed: speakerData.isFixed };

      const isSelected = (speakerData.id === selectedSpeakerId);

      // Dimensions (Studio Monitor Standard: ~24cm W x 38cm H x 26cm D)
      const sw = 0.24;
      const sh = 0.38;
      const sd = 0.26;

      // 6.1 Cabinet Body
      const cabinetGeo = new THREE.BoxGeometry(sw, sh, sd);
      const cabinetMat = new THREE.MeshStandardMaterial({
        color: isSelected ? 0x1e293b : 0x181e28,
        roughness: 0.6,
        metalness: 0.2
      });
      const cabinet = new THREE.Mesh(cabinetGeo, cabinetMat);
      group.add(cabinet);

      // 6.2 Front Bevel Edge / Accent Rim
      const edges = new THREE.EdgesGeometry(cabinetGeo);
      const edgeMat = new THREE.LineBasicMaterial({
        color: isSelected ? 0x38bdf8 : 0x475569,
        linewidth: isSelected ? 2 : 1
      });
      const wire = new THREE.LineSegments(edges, edgeMat);
      group.add(wire);

      // 6.3 Front Face details (Placed at +Z = sd/2 + 0.002m)
      const frontZ = sd / 2 + 0.002;

      // --- HIGH FREQUENCY TWEETER (소리 방사 전면 기준) ---
      const tweeterRimGeo = new THREE.RingGeometry(0.028, 0.045, 24);
      const tweeterRimMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4 });
      const tweeterRim = new THREE.Mesh(tweeterRimGeo, tweeterRimMat);
      tweeterRim.position.set(0, 0.09, frontZ);
      group.add(tweeterRim);

      const tweeterDomeGeo = new THREE.SphereGeometry(0.024, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2);
      tweeterDomeGeo.rotateX(Math.PI / 2);
      const tweeterDomeMat = new THREE.MeshStandardMaterial({
        color: isSelected ? 0x38bdf8 : 0x0ea5e9,
        emissive: isSelected ? 0x0284c7 : 0x0369a1,
        emissiveIntensity: 0.6,
        roughness: 0.2
      });
      const tweeterDome = new THREE.Mesh(tweeterDomeGeo, tweeterDomeMat);
      tweeterDome.position.set(0, 0.09, frontZ);
      group.add(tweeterDome);

      // --- LOW FREQUENCY WOOFER ---
      const wooferRimGeo = new THREE.RingGeometry(0.065, 0.09, 32);
      const wooferRimMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5 });
      const wooferRim = new THREE.Mesh(wooferRimGeo, wooferRimMat);
      wooferRim.position.set(0, -0.07, frontZ);
      group.add(wooferRim);

      const wooferConeGeo = new THREE.CircleGeometry(0.065, 32);
      const wooferConeMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
      const wooferCone = new THREE.Mesh(wooferConeGeo, wooferConeMat);
      wooferCone.position.set(0, -0.07, frontZ + 0.001);
      group.add(wooferCone);

      const dustCapGeo = new THREE.SphereGeometry(0.022, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
      dustCapGeo.rotateX(Math.PI / 2);
      const dustCapMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3 });
      const dustCap = new THREE.Mesh(dustCapGeo, dustCapMat);
      dustCap.position.set(0, -0.07, frontZ + 0.002);
      group.add(dustCap);

      // 6.4 Floating 3D Channel Badge Text Sprite
      const badgeCanvas = document.createElement('canvas');
      badgeCanvas.width = 128;
      badgeCanvas.height = 64;
      const ctx = badgeCanvas.getContext('2d');
      ctx.fillStyle = isSelected ? '#0284c7' : '#0f172a';
      ctx.beginPath();
      ctx.roundRect(4, 4, 120, 56, 12);
      ctx.fill();
      ctx.strokeStyle = isSelected ? '#38bdf8' : '#334155';
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 26px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`CH ${(speakerData.channel !== undefined ? speakerData.channel + 1 : 1)}`, 64, 32);

      const badgeTex = new THREE.CanvasTexture(badgeCanvas);
      const spriteMat = new THREE.SpriteMaterial({ map: badgeTex, depthTest: false });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(0.4, 0.2, 1.0);
      sprite.position.set(0, sh / 2 + 0.16, 0);
      group.add(sprite);

      // 6.5 3D Acoustic Dispersion Cone (Acoustic Beam from Tweeter face)
      const dispersionAngle = (speakerData.dispersionAngle || 90) * Math.PI / 180;
      const beamLength = 1.8;
      const coneRadius = Math.tan(dispersionAngle / 2) * beamLength;
      const coneGeo = new THREE.ConeGeometry(coneRadius, beamLength, 16, 1, true);
      coneGeo.rotateX(-Math.PI / 2);
      coneGeo.translate(0, 0, beamLength / 2);

      const coneMat = new THREE.MeshBasicMaterial({
        color: isSelected ? 0x38bdf8 : 0x0284c7,
        transparent: true,
        opacity: isSelected ? 0.25 : 0.08,
        wireframe: true,
        side: THREE.DoubleSide
      });
      const dispCone = new THREE.Mesh(coneGeo, coneMat);
      dispCone.position.set(0, 0.0, frontZ);
      group.add(dispCone);

      // --- 6.6 Position & 3D Rotation Transform ---
      const posX = speakerData.x - (currentRoom.width / 2);
      const posZ = speakerData.y - (currentRoom.depth / 2);
      const posY = speakerData.z || 1.8;

      group.position.set(posX, posY, posZ);

      // 3D Pitch Tilt & Yaw Rotation
      const yawRad = ((speakerData.rotation || 0) * Math.PI) / 180;
      const pitchRad = ((speakerData.pitchTilt || 0) * Math.PI) / 180;

      group.rotation.order = 'YXZ';
      group.rotation.y = yawRad;
      group.rotation.x = -pitchRad;

      return group;
    }

    // --- 7. Update Scene Graph from Flutter State ---
    window.updateScene = function(data) {
      if (!data) return;

      if (data.room) {
        const roomChanged = !currentRoom || 
            currentRoom.width !== data.room.width || 
            currentRoom.depth !== data.room.depth || 
            currentRoom.height !== data.room.height ||
            currentRoom.earLevel !== data.room.earLevel;
            
        if (roomChanged) {
            currentRoom = data.room;
            buildRoom(currentRoom.width, currentRoom.depth, currentRoom.height);
            buildListenerMannequin(currentRoom.earLevel || 1.2);
        }
      }

      if (data.selectedSpeakerId !== undefined) {
        selectedSpeakerId = data.selectedSpeakerId;
      }

      if (data.speakers) {
        currentSpeakers = data.speakers;
        const validIds = new Set(currentSpeakers.map(s => s.id));
        
        // Remove deleted speakers
        for (let i = speakersGroup.children.length - 1; i >= 0; i--) {
          const child = speakersGroup.children[i];
          if (!validIds.has(child.userData.speakerId)) {
            speakersGroup.remove(child);
          }
        }

        // Update or create speakers
        currentSpeakers.forEach(sp => {
          let mesh = speakersGroup.children.find(c => c.userData.speakerId === sp.id);
          const isSelected = (sp.id === selectedSpeakerId);
          
          if (mesh) {
            // Update position
            const posX = sp.x - (currentRoom.width / 2);
            const posZ = sp.y - (currentRoom.depth / 2);
            const posY = sp.z || 1.8;
            mesh.position.set(posX, posY, posZ);
            
            // Update rotation
            const yawRad = ((sp.rotation || 0) * Math.PI) / 180;
            const pitchRad = ((sp.pitchTilt || 0) * Math.PI) / 180;
            mesh.rotation.set(-pitchRad, -yawRad, 0);

            // Update isFixed
            mesh.userData.isFixed = sp.isFixed;
            
            // Update selection colors
            const colorCabinet = isSelected ? 0x1e293b : 0x181e28;
            const colorWire = isSelected ? 0x38bdf8 : 0x475569;
            const colorDome = isSelected ? 0x38bdf8 : 0x0ea5e9;
            const emissiveDome = isSelected ? 0x0284c7 : 0x0369a1;
            
            if (mesh.children.length > 3) {
              if (mesh.children[0].material) mesh.children[0].material.color.setHex(colorCabinet);
              if (mesh.children[1].material) mesh.children[1].material.color.setHex(colorWire);
              if (mesh.children[3].material) {
                mesh.children[3].material.color.setHex(colorDome);
                mesh.children[3].material.emissive.setHex(emissiveDome);
              }
            }
          } else {
            mesh = createSpeaker3DMesh(sp);
            speakersGroup.add(mesh);
          }
        });
      }
    };

    // --- 8. Set Camera View Presets ---
    window.setCameraView = function(viewName) {
      const maxDim = Math.max(currentRoom.width, currentRoom.depth, currentRoom.height * 1.5);
      const dist = maxDim * 1.5;

      window.currentViewName = viewName;
      switch(viewName) {
        case 'Auto':
          camera.position.set(0, currentRoom.height * 1.5, dist);
          controls.target.set(0, currentRoom.height * 0.4, 0);
          break;
        case 'Front':
          camera.position.set(0, currentRoom.height * 0.5, dist);
          controls.target.set(0, currentRoom.height * 0.4, 0);
          break;
        case 'Back':
          camera.position.set(0, currentRoom.height * 0.5, -dist);
          controls.target.set(0, currentRoom.height * 0.4, 0);
          break;
        case 'Side(L)':
          camera.position.set(-dist, currentRoom.height * 0.5, 0);
          controls.target.set(0, currentRoom.height * 0.4, 0);
          break;
        case 'Side(R)':
          camera.position.set(dist, currentRoom.height * 0.5, 0);
          controls.target.set(0, currentRoom.height * 0.4, 0);
          break;
        case 'Top':
          camera.position.set(0, dist * 1.2, 0.01);
          controls.target.set(0, 0, 0);
          break;
      }
      controls.update();
    };

    // --- 9. Interactive Raycasting / Click Selection ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    let draggedSpeakerNode = null;
    let dragOffset = new THREE.Vector3();
    let dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

    window.addEventListener('pointerdown', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(speakersGroup.children, true);

      if (intersects.length > 0) {
        let root = intersects[0].object;
        while (root && root.parent && root.parent !== speakersGroup) {
          root = root.parent;
        }
        if (root && root.userData && root.userData.speakerId) {
          const clickedId = root.userData.speakerId;
          const isFixed = root.userData.isFixed;
          selectedSpeakerId = clickedId;
          window.updateScene({ speakers: currentSpeakers, selectedSpeakerId: clickedId });

          if (window.SpeakerBridge) {
            window.SpeakerBridge.postMessage(JSON.stringify({
              type: 'SPEAKER_SELECTED',
              speakerId: clickedId
            }));
          }

          console.log("Clicked ID: " + clickedId + ", isFixed: " + isFixed); if (!isFixed) {
            draggedSpeakerNode = root;
            controls.enabled = false;
            dragPlane.constant = -root.position.y;
            const intersectPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(dragPlane, intersectPoint);
            if (intersectPoint) {
              dragOffset.copy(intersectPoint).sub(root.position);
            }
          }
        }
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!draggedSpeakerNode) return;
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersectPoint = new THREE.Vector3();
      raycaster.ray.intersectPlane(dragPlane, intersectPoint);
      if (intersectPoint) {
        const newPos = intersectPoint.sub(dragOffset);
        
        // Clamp to room bounds (account for 0.2m speaker mesh radius)
        const halfW = (currentRoom.width / 2) - 0.2;
        const halfD = (currentRoom.depth / 2) - 0.2;
        
        if (window.isSnapEnabled) {
          newPos.x = Math.round(newPos.x * 10) / 10;
          newPos.z = Math.round(newPos.z * 10) / 10;
        }
        
        newPos.x = Math.max(-halfW, Math.min(halfW, newPos.x));
        newPos.z = Math.max(-halfD, Math.min(halfD, newPos.z));
        
        draggedSpeakerNode.position.x = newPos.x;
        draggedSpeakerNode.position.z = newPos.z;
        
        // The beam (if visible) is attached to the speaker so it moves with it
        // We can send live updates to flutter or just wait for pointerup
        if (window.SpeakerBridge) {
          window.SpeakerBridge.postMessage(JSON.stringify({
            type: 'SPEAKER_DRAGGING',
            speakerId: draggedSpeakerNode.userData.speakerId,
            x: newPos.x + currentRoom.width / 2,
            y: newPos.z + currentRoom.depth / 2
          }));
        }
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (draggedSpeakerNode) {
        controls.enabled = true;
        const finalX = draggedSpeakerNode.position.x + currentRoom.width / 2;
        const finalY = draggedSpeakerNode.position.z + currentRoom.depth / 2;
        
        if (window.SpeakerBridge) {
          window.SpeakerBridge.postMessage(JSON.stringify({
            type: 'SPEAKER_MOVED',
            speakerId: draggedSpeakerNode.userData.speakerId,
            x: finalX,
            y: finalY
          }));
        }
        draggedSpeakerNode = null;
      }
    });

    
    // --- 9.5 Double Click to Reset Camera ---
    window.addEventListener('dblclick', () => {
      window.setCameraView(window.currentViewName || 'Auto');
    });

    // --- 10. Window Resize Handler ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 11. Initial Scene Build ---
    buildRoom(currentRoom.width, currentRoom.depth, currentRoom.height);
    buildListenerMannequin();

    // Trigger initial resize to fix any layout issues on macOS WKWebView
    window.dispatchEvent(new Event('resize'));

    // --- 12. Render Loop ---
    
    let isTopView = false;
    let savedCameraPos = new THREE.Vector3();
    let savedTarget = new THREE.Vector3();

    window.toggleTopView = function() {
      isTopView = !isTopView;
      if (isTopView) {
        // Save current state
        savedCameraPos.copy(camera.position);
        savedTarget.copy(controls.target);
        
        // Move to top view
        // The room max size is around 20-30m, so height of 20m should see everything
        const roomMaxDim = currentRoom ? Math.max(currentRoom.width, currentRoom.depth) : 10;
        const h = Math.max(roomMaxDim * 1.5, 10);
        camera.position.set(0, h, 0);
        controls.target.set(0, 0, 0);
        
        // Disable rotation so it stays 2D
        controls.enableRotate = false;
        // Optionally lock to orthographic style if wanted, but just top-down perspective is fine
      } else {
        // Restore state
        camera.position.copy(savedCameraPos);
        controls.target.copy(savedTarget);
        controls.enableRotate = true;
      }
      controls.update();
    };

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
