<svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A3C42" />
      <stop offset="100%" stop-color="#2A2C30" />
    </linearGradient>
  </defs>

  <!-- 윗면 배경 -->
  <rect x="0" y="0" width="160" height="120" fill="url(#topGrad)" stroke="#333" stroke-width="2" />
  
  <!-- 안쪽 음각 디테일 -->
  <rect x="10" y="10" width="140" height="100" fill="none" stroke="#222" stroke-width="1" opacity="0.6" />
  
  <!-- 정면 방향 표시 화살표 -->
  <!-- 아래쪽(Bottom)이 스피커의 Front 방향을 향하도록 배치 -->
  <polygon points="80,90 60,60 100,60" fill="#FFFFFF" opacity="0.9" />
</svg>
