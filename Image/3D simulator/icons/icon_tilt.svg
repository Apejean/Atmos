<svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#4FC3F7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
  <!-- 스피커 스탠드 (바닥 및 기둥) -->
  <line x1="20" y1="58" x2="44" y2="58" stroke-width="1.5" />
  <line x1="32" y1="58" x2="32" y2="44" stroke-width="1.5" />

  <!-- Ghost 스피커 (똑바로 서있는 원래 위치) - 반투명 처리 -->
  <rect x="22" y="16" width="20" height="30" rx="2" stroke-opacity="0.3" stroke-width="1.2" />

  <!-- Tilted 스피커 (앞으로 숙여진 상태) -->
  <g transform="rotate(-15, 32, 44)">
    <!-- 스피커 본체 (배경을 가리도록 fill 적용) -->
    <rect x="22" y="16" width="20" height="30" rx="2" fill="#0F1722" fill-opacity="0.9" stroke-width="1.5" />
    
    <!-- 후면 앰프/단자 돌출부 디테일 -->
    <path d="M 22 28 L 18 28 L 18 36 L 22 36" stroke-width="1.2" />
    
    <!-- 전면 그릴 라인 디테일 -->
    <line x1="38" y1="20" x2="38" y2="42" opacity="0.6" stroke-width="1" />
  </g>

  <!-- 상단 회전(Tilt) 화살표 아크 (뭉개짐 해결을 위해 Q베지어 곡선 수치와 화살촉 정밀 조정) -->
  <path d="M 44 13 Q 32 5 20 11" stroke-width="1.5" fill="none" />
  
  <!-- 화살촉 (끝이 뭉개지지 않도록 path로 날카롭게 그림) -->
  <path d="M 21 6 L 19 11.5 L 26 13" stroke-width="1.5" fill="none" />
</svg>
