<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Grid & Patterns -->
  <defs>
    <!-- Small Grid Lines -->
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#162236" stroke-width="0.5"/>
    </pattern>
    <!-- Large Grid Lines -->
    <pattern id="largeGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#smallGrid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#253855" stroke-width="1"/>
    </pattern>
    
    <!-- CAD Diagonal Hatch Pattern -->
    <pattern id="cadHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#3A6482" stroke-width="1.5" opacity="0.8"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="#0A0C16"/>
  <rect width="100%" height="100%" fill="url(#largeGrid)"/>

  <!-- Continuous CAD Wall (Hatched Fill with Solid Borders) -->
  <path 
    d="M 100 80 L 700 80 L 700 520 L 100 520 Z M 110 90 L 110 510 L 690 510 L 690 90 Z" 
    fill="url(#cadHatch)" 
    fill-rule="evenodd" 
    stroke="#5B8DA8" 
    stroke-width="1.5" 
  />
</svg>
