<svg width="160" height="280" viewBox="0 0 160 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 배경 그라데이션 -->
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A2C30" />
      <stop offset="100%" stop-color="#15161A" />
    </linearGradient>
    <!-- 흰색 스피커 콘 그라데이션 -->
    <radialGradient id="coneGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#E0E0E0" />
      <stop offset="100%" stop-color="#B0B0B0" />
    </radialGradient>
  </defs>

  <!-- 바탕 테두리 -->
  <rect x="0" y="0" width="160" height="280" fill="url(#frontGrad)" stroke="#333" stroke-width="2" />
  
  <!-- 상단 트위터 -->
  <circle cx="80" cy="70" r="30" fill="url(#coneGrad)" stroke="#888" stroke-width="3" />
  <circle cx="80" cy="70" r="12" fill="#F5F5F5" stroke="#888" stroke-width="1" />
  
  <!-- 하단 우퍼 -->
  <circle cx="80" cy="190" r="56" fill="url(#coneGrad)" stroke="#888" stroke-width="4" />
  <circle cx="80" cy="190" r="28" fill="url(#coneGrad)" stroke="#AAA" stroke-width="2" />
  <circle cx="80" cy="190" r="12" fill="#F5F5F5" stroke="#888" stroke-width="1" />
</svg>
