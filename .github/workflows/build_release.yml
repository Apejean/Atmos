name: Build and Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  # PR마다 Windows·macOS 빌드를 돌린다. 릴리스는 태그에서만 한다.
  pull_request:
    branches: [main]
  workflow_dispatch:

# 같은 PR에 커밋이 또 올라오면 앞선 빌드를 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: atmos_mixer_pro_windows.zip
            build_cmd: flutter build windows
            artifact_path: build/windows/x64/runner/Release/*
          - os: macos-latest
            artifact_name: atmos_mixer_pro_macos.zip
            build_cmd: flutter build macos
            artifact_path: build/macos/Build/Products/Release/atmos_mixer_pro.app

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            atmos_mixer_pro/rust
            atmos_mixer_pro/supervisor

      # 감시 프로그램(충돌·멈춤 뒤 앱을 다시 띄움). Windows에서도 돌려 넘겨받기(프로세스 핸들) 경로를 확인한다.
      - name: Supervisor tests
        run: cargo test --manifest-path atmos_mixer_pro/supervisor/Cargo.toml
        
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Windows LLVM for ASIO
        if: matrix.os == 'windows-latest'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "15.0"
          directory: ${{ runner.temp }}/llvm
          
      - name: Set LIBCLANG_PATH
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          echo "LIBCLANG_PATH=${{ env.LLVM_PATH }}/bin" >> $env:GITHUB_ENV

      - name: Download and Extract ASIO SDK
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip" -OutFile "asio.zip"
          Expand-Archive -Path "asio.zip" -DestinationPath "ASIOSDK_EXTRACTED"
          $asioDir = Get-ChildItem -Path "ASIOSDK_EXTRACTED" -Directory | Select-Object -First 1
          echo "CPAL_ASIO_DIR=$($asioDir.FullName)" >> $env:GITHUB_ENV

      - name: Patch pdfx CMakeLists for Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $cmakePath = "atmos_mixer_pro/windows/flutter/ephemeral/.plugin_symlinks/pdfx/windows/CMakeLists.txt"
          if (Test-Path $cmakePath) {
            (Get-Content $cmakePath) -replace 'cmake_minimum_required\(VERSION 3.0\)', 'cmake_minimum_required(VERSION 3.5)' | Set-Content $cmakePath
          }
          $downloadPath = "atmos_mixer_pro/windows/flutter/ephemeral/.plugin_symlinks/pdfx/windows/DownloadProject.cmake"
          if (Test-Path $downloadPath) {
            (Get-Content $downloadPath) -replace 'cmake_minimum_required\(VERSION 2.8.2\)', 'cmake_minimum_required(VERSION 3.5)' | Set-Content $downloadPath
          }

      - name: Install dependencies
        run: flutter pub get
        working-directory: atmos_mixer_pro

      - name: Cargo Check to reveal Windows Rust errors
        if: matrix.os == 'windows-latest'
        run: cargo check
        working-directory: atmos_mixer_pro/rust

      - name: Build
        run: ${{ matrix.build_cmd }}
        working-directory: atmos_mixer_pro

      # 감시 프로그램을 앱 옆에 둔다. installer의 바로가기·로그인 자동 실행이 이것을 띄운다.
      - name: Add supervisor to Release (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo build --release --manifest-path atmos_mixer_pro/supervisor/Cargo.toml
          Copy-Item atmos_mixer_pro/supervisor/target/release/atmos_supervisor.exe atmos_mixer_pro/build/windows/x64/runner/Release/
        
      - name: Archive Release (Windows)
        if: matrix.os == 'windows-latest'
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          directory: atmos_mixer_pro/build/windows/x64/runner/Release
          filename: ../../../../../../${{ matrix.artifact_name }}

      - name: Archive Release (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd atmos_mixer_pro/build/macos/Build/Products/Release
          zip -r ../../../../../../${{ matrix.artifact_name }} atmos_mixer_pro.app
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            atmos_mixer_pro_windows.zip/atmos_mixer_pro_windows.zip
            atmos_mixer_pro_macos.zip/atmos_mixer_pro_macos.zip
